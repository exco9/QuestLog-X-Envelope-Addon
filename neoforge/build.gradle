plugins {
    id "com.gradleup.shadow"
}

architectury {
    platformSetupLoomIde()
    neoForge()
}

configurations {
    common {
        canBeResolved = true
        canBeConsumed = false
    }
    compileClasspath.extendsFrom common
    runtimeClasspath.extendsFrom common
    developmentNeoForge.extendsFrom common

    shadowBundle {
        canBeResolved = true
        canBeConsumed = false
    }
}

dependencies {
    neoForge "net.neoforged:neoforge:${rootProject.neoforge_version}"

    modImplementation("maven.modrinth:ufQYCY6N:${rootProject.questlog_neoforge_version_id}") { transitive = false }
    modImplementation("curse.maven:envelope-1281170:${rootProject.envelope_neoforge_file_id}") { transitive = false }

    modImplementation "me.shedaniel.cloth:cloth-config-neoforge:${rootProject.cloth_config_version}"
    modImplementation "maven.modrinth:triggers:${rootProject.triggers_version}-neoforge"

    implementation "net.jodah:typetools:0.6.3"
    implementation "com.google.code.findbugs:jsr305:3.0.1"

    common(project(path: ':common', configuration: 'namedElements')) { transitive = false }
    shadowBundle project(path: ':common', configuration: 'transformProductionNeoForge')
}

shadowJar {
    exclude("architectury.common.json")
    configurations = [project.configurations.shadowBundle]
    archiveClassifier = 'dev-shadow'
}

remapJar {
    inputFile.set shadowJar.archiveFile
}
