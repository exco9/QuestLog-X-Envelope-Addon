name: bootstrap-repository-files

on:
  workflow_dispatch:
  push:
    branches:
      - dev/**
    paths-ignore:
      - gradlew
      - gradlew.bat
      - gradle/wrapper/**
      - LICENSE

permissions:
  contents: write

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.0'

      - name: Generate standard Gradle wrapper
        run: gradle wrapper --gradle-version 9.5.0

      - name: Install canonical GPLv3 license text
        shell: bash
        run: curl --fail --location --silent --show-error https://www.gnu.org/licenses/gpl-3.0.txt --output LICENSE

      - name: Commit generated repository files
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add gradlew gradlew.bat gradle/wrapper/gradle-wrapper.jar gradle/wrapper/gradle-wrapper.properties LICENSE
          if git diff --cached --quiet; then
            echo "Wrapper and license are already up to date."
            exit 0
          fi
          git commit -m "build: add Gradle wrapper and GPLv3 license"
          git push
