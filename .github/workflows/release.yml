name: release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v4

      - name: Validate Gradle wrapper
        shell: bash
        run: |
          test -f gradlew
          test -f gradle/wrapper/gradle-wrapper.jar
          grep -Fq 'gradle-9.5.0-bin.zip' gradle/wrapper/gradle-wrapper.properties
          chmod +x gradlew

      - name: Build
        run: ./gradlew build --stacktrace

      - name: Verify distributable jars
        run: bash scripts/verify-build.sh

      - name: Validate tag matches project version
        shell: bash
        run: |
          project_version="$(grep '^mod_version=' gradle.properties | cut -d= -f2-)"
          tag_version="${GITHUB_REF_NAME#v}"
          if [[ "${project_version}" != "${tag_version}" ]]; then
            echo "Tag ${GITHUB_REF_NAME} does not match mod_version=${project_version}." >&2
            exit 1
          fi

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          if gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1; then
            gh release upload "${GITHUB_REF_NAME}" dist/*.jar --clobber
          else
            gh release create "${GITHUB_REF_NAME}" dist/*.jar \
              --title "${GITHUB_REF_NAME}" \
              --generate-notes
          fi
