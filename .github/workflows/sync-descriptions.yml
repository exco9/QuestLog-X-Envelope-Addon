name: Sync project descriptions

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: project-description-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Sync Modrinth and prepare CurseForge description
        env:
          MODRINTH_PROJECT_ID: ${{ vars.MODRINTH_PROJECT_ID }}
          MODRINTH_TOKEN: ${{ secrets.MODRINTH_TOKEN }}
        run: python3 scripts/sync-platform-descriptions.py
      - name: Save platform descriptions and previous Modrinth body
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: platform-descriptions
          path: platform-descriptions/
          if-no-files-found: error
          retention-days: 14
