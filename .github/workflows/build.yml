name: build

on:
  push:
    branches:
      - main
      - dev/**
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v4

      - name: Validate Gradle wrapper
        shell: bash
        run: |
          test -f gradlew
          test -f gradle/wrapper/gradle-wrapper.jar
          grep -Fq 'gradle-9.5.0-bin.zip' gradle/wrapper/gradle-wrapper.properties
          chmod +x gradlew

      - name: Build
        run: ./gradlew build --stacktrace

      - name: Verify distributable jars
        run: bash scripts/verify-build.sh

      - name: Upload Fabric and NeoForge jars
        uses: actions/upload-artifact@v4
        with:
          name: questlog-envelope-${{ github.sha }}
          path: dist/*.jar
          if-no-files-found: error
          retention-days: 14
