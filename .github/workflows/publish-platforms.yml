name: Publish CurseForge and Modrinth

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing GitHub release tag
        required: true
        default: v0.1.2
        type: string
      dry_run:
        description: Validate files and metadata without uploading
        default: true
        type: boolean
      platform:
        description: Destination to publish
        default: both
        type: choice
        options: [both, modrinth, curseforge]
  workflow_call:
    inputs:
      release_tag:
        required: true
        type: string
      dry_run:
        default: false
        type: boolean
      platform:
        default: both
        type: string
    secrets:
      MODRINTH_TOKEN:
        required: false
      CURSEFORGE_TOKEN:
        required: false

permissions:
  contents: read

concurrency:
  group: platform-publication-${{ inputs.release_tag }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Validate configuration
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
          DRY_RUN: ${{ inputs.dry_run }}
          PLATFORM: ${{ inputs.platform }}
          MODRINTH_PROJECT_ID: ${{ vars.MODRINTH_PROJECT_ID }}
          CURSEFORGE_PROJECT_ID: ${{ vars.CURSEFORGE_PROJECT_ID }}
          MODRINTH_TOKEN: ${{ secrets.MODRINTH_TOKEN }}
          CURSEFORGE_TOKEN: ${{ secrets.CURSEFORGE_TOKEN }}
        shell: bash
        run: |
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo 'Expected a release tag such as v0.1.2.' >&2; exit 1; }
          [[ "$PLATFORM" == both || "$PLATFORM" == modrinth || "$PLATFORM" == curseforge ]] || { echo 'Unknown publication platform.' >&2; exit 1; }
          if [[ "$DRY_RUN" != true ]]; then
            if [[ "$PLATFORM" != curseforge ]]; then
              [[ "$MODRINTH_PROJECT_ID" =~ ^[A-Za-z0-9]{8}$ && -n "$MODRINTH_TOKEN" ]] || { echo 'Set MODRINTH_PROJECT_ID variable and MODRINTH_TOKEN secret.' >&2; exit 1; }
            fi
            if [[ "$PLATFORM" != modrinth ]]; then
              [[ "$CURSEFORGE_PROJECT_ID" =~ ^[0-9]+$ && -n "$CURSEFORGE_TOKEN" ]] || { echo 'Set CURSEFORGE_PROJECT_ID variable and CURSEFORGE_TOKEN secret.' >&2; exit 1; }
            fi
          fi

      - name: Verify Modrinth project access
        if: ${{ !inputs.dry_run && inputs.platform != 'curseforge' }}
        env:
          MODRINTH_PROJECT_ID: ${{ vars.MODRINTH_PROJECT_ID }}
          MODRINTH_TOKEN: ${{ secrets.MODRINTH_TOKEN }}
        shell: python
        run: |
          import json, os, urllib.request, urllib.error
          project_id = os.environ['MODRINTH_PROJECT_ID']
          request = urllib.request.Request(
              f'https://api.modrinth.com/v2/project/{project_id}',
              headers={'Authorization': os.environ['MODRINTH_TOKEN'],
                       'User-Agent': 'exco9/QuestLog-X-Envelope-Addon/release-workflow'})
          try:
              with urllib.request.urlopen(request, timeout=30) as response:
                  project = json.load(response)
          except urllib.error.HTTPError as error:
              user_request = urllib.request.Request('https://api.modrinth.com/v2/user', headers=request.headers)
              try:
                  with urllib.request.urlopen(user_request, timeout=30) as response:
                      user = json.load(response)
                  print(f"Token account: {user['username']}")
                  projects_request = urllib.request.Request(
                      f"https://api.modrinth.com/v2/user/{user['id']}/projects", headers=request.headers)
                  with urllib.request.urlopen(projects_request, timeout=30) as response:
                      projects = json.load(response)
                  matching = [p for p in projects if p['id'] == project_id or p['slug'] == 'qlxe']
                  for candidate in matching:
                      print(f"Account QLXE project: id={candidate['id']}, slug={candidate['slug']}, status={candidate['status']}")
                  if not matching:
                      print('Configured QLXE project is not visible in this token account project list.')
              except urllib.error.HTTPError as diagnostic_error:
                  diagnostic = json.loads(diagnostic_error.read())
                  error_code = diagnostic.get('error', 'unknown')
                  if error_code not in {'invalid_token', 'invalid_scope', 'authentication_error', 'unauthorized'}:
                      error_code = 'unknown'
                  print(f'Token account/project diagnostic failed (HTTP {diagnostic_error.code}, {error_code}); check token permissions.')
              raise SystemExit(f'Modrinth project access failed (HTTP {error.code}); check project ID and token permissions.')
          if project['id'] != project_id or project['slug'] != 'qlxe':
              raise SystemExit('Modrinth project does not match the configured QLXE project.')
          print(f"Verified Modrinth project: {project['title']} ({project_id})")

  publish:
    needs: validate
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        platform: ${{ fromJSON(inputs.platform == 'both' && '["modrinth","curseforge"]' || format('["{0}"]', inputs.platform)) }}
        loader: [fabric, neoforge]
    steps:
      - name: Checkout publishing tools
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          path: publishing-tools

      - name: Checkout released source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ inputs.release_tag }}
          path: released-source

      - name: Download release artifact
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ inputs.release_tag }}
          LOADER: ${{ matrix.loader }}
        run: gh release download "$RELEASE_TAG" --pattern "questlog-envelope-addon-${LOADER}-*.jar" --dir artifacts

      - name: Validate release and prepare metadata
        id: metadata
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
          LOADER: ${{ matrix.loader }}
        run: python3 publishing-tools/scripts/prepare-platform-release.py released-source artifacts

      - name: Publish loader version
        if: ${{ !inputs.dry_run }}
        uses: Kira-NT/mc-publish@52307b03863581dec6b652b83e597aec02ebb075 # v3.3
        with:
          modrinth-id: ${{ matrix.platform == 'modrinth' && vars.MODRINTH_PROJECT_ID || '' }}
          modrinth-token: ${{ matrix.platform == 'modrinth' && secrets.MODRINTH_TOKEN || '' }}
          curseforge-id: ${{ matrix.platform == 'curseforge' && vars.CURSEFORGE_PROJECT_ID || '' }}
          curseforge-token: ${{ matrix.platform == 'curseforge' && secrets.CURSEFORGE_TOKEN || '' }}
          files: ${{ steps.metadata.outputs.file }}
          name: QuestLog x Envelope ${{ steps.metadata.outputs.version }} (${{ matrix.loader }})
          version: ${{ steps.metadata.outputs.version }}-${{ matrix.loader }}
          version-type: release
          loaders: ${{ matrix.loader }}
          game-versions: ${{ steps.metadata.outputs.minecraft }}
          java: '21'
          environment: client | server
          changelog-file: platform-changelog.md
          dependencies: |
            questlog(required){modrinth:ufQYCY6N}{curseforge:questlog}
            envelope(required){modrinth:bINSbhYK}{curseforge:1281170}
            ${{ matrix.loader == 'fabric' && 'fabric-api(required){modrinth:P7dR8mSH}{curseforge:306612}' || '' }}
          retry-attempts: 1
          fail-mode: fail
