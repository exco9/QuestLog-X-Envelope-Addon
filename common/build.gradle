architectury {
    common(rootProject.enabled_platforms.split(","))
}

dependencies {
    // Required by Architectury common source sets for environment annotations.
    modImplementation "net.fabricmc:fabric-loader:${rootProject.fabric_loader_version}"

    // Compile common integration code against the NeoForge distributions.
    // Runtime distributions are supplied by the loader-specific projects.
    modCompileOnly("maven.modrinth:ufQYCY6N:${rootProject.questlog_neoforge_version_id}") { transitive = false }
    modCompileOnly("curse.maven:envelope-1281170:${rootProject.envelope_neoforge_file_id}") { transitive = false }

    compileOnly "org.jetbrains:annotations:26.0.2-1"

    testImplementation platform('org.junit:junit-bom:5.11.4')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

test {
    useJUnitPlatform()
}
