plugins {
    id 'dev.architectury.loom' version '1.13-SNAPSHOT' apply false
    id 'architectury-plugin' version '3.4-SNAPSHOT'
    id 'com.gradleup.shadow' version '8.3.6' apply false
}

architectury {
    minecraft = rootProject.minecraft_version
}

allprojects {
    group = rootProject.maven_group
    version = rootProject.mod_version
}

subprojects {
    apply plugin: 'dev.architectury.loom'

    // Configure Loom immediately after applying it. Architectury may read/finalize
    // Loom mapping properties during its own plugin application, so this must
    // happen before applying 'architectury-plugin'.
    loom {
        silentMojangMappingsLicense()
    }

    apply plugin: 'architectury-plugin'
    apply plugin: 'maven-publish'

    base {
        archivesName = "${rootProject.archives_name}-${project.name}-${rootProject.minecraft_version}"
    }

    repositories {
        mavenCentral()
        maven { url = "https://maven.neoforged.net/releases/" }
        maven { url = "https://maven.fabricmc.net/" }
        maven { url = "https://maven.architectury.dev/" }
        maven { url = "https://maven.shedaniel.me/" }
        maven {
            name = "Modrinth"
            url = "https://api.modrinth.com/maven"
            content { includeGroup "maven.modrinth" }
        }
        maven {
            name = "CurseMaven"
            url = "https://www.cursemaven.com"
            content { includeGroup "curse.maven" }
        }
        maven {
            name = "Forge Config API Port"
            url = "https://raw.githubusercontent.com/Fuzss/modresources/main/maven/"
        }
    }

    dependencies {
        minecraft "com.mojang:minecraft:${rootProject.minecraft_version}"
        mappings(loom.layered {
            officialMojangMappings()
        })
    }

    java {
        withSourcesJar()
        sourceCompatibility = JavaVersion.VERSION_21
        targetCompatibility = JavaVersion.VERSION_21
    }

    tasks.withType(JavaCompile).configureEach {
        options.release = 21
    }

    processResources {
        inputs.property "version", rootProject.mod_version
        inputs.property "minecraft_version", rootProject.minecraft_version

        filesMatching(["fabric.mod.json", "META-INF/neoforge.mods.toml"]) {
            expand(
                version: rootProject.mod_version,
                minecraft_version: rootProject.minecraft_version,
                mod_id: rootProject.mod_id,
                mod_name: rootProject.mod_name,
                mod_description: rootProject.mod_description
            )
        }
    }
}
