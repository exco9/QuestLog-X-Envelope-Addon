<rect width="960" height="490" rx="16" fill="#24251f"/><rect x="20" y="20" width="450" height="210" rx="12" fill="url(#paper)"/><g transform="translate(45 57)"><g stroke="#8c6638" stroke-width="5" stroke-linejoin="miter">
