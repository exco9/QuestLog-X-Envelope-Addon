</g><path fill="#933d40" d="M34 43H50V47H54V61H50V65H34V61H30V47H34Z"/><path fill="#c46659" d="M35 47H47V51H35Z"/></g><text x="150" y="84" font-family="Verdana, sans-serif" font-size="24" font-weight="bold" fill="#59452e">Quest letters</text><text x="150" y="120" font-family="Verdana, sans-serif" font-size="13" font-weight="normal" fill="#59452e">Send invitations, clues and quest rewards</text><text x="150" y="145" font-family="Verdana, sans-serif" font-size="13" font-weight="normal" fill="#59452e">as physical Envelope mail.</text><path d="M45 178H445" stroke="#ceb893"/><text x="45" y="205" font-family="Verdana, sans-serif" font-size="13" font-weight="normal" fill="#7c6548">Rich text · Wax seals · Quest invitations</text><rect x="490" y="20" width="450" height="210" rx="12" fill="url(#paper)"/><g transform="translate(515 57)"><g stroke="#8c6638" stroke-width="5" stroke-linejoin="miter"><path fill="#d6ac6b" d="M0 28L42 8L84 28V72L42 92L0 72Z"/><path fill="#f1d79a" d="M0 28L42 48L84 28L42 8Z"/><path fill="#bf9155" d="M42 48V92L84 72V28Z"/></g><path fill="#f6e8c6" d="M29 14L42 8L55 14L13 35L0 28Z M33 44L46 50V91L33 86Z"/></g><text x="620" y="84" font-family="Verdana, sans-serif" font-size="24" font-weight="bold" fill="#59452e">Package rewards</text><text x="620" y="120" font-family="Verdana, sans-serif" font-size="13" font-weight="normal" fill="#59452e">Deliver supplies and loot in packages.</text><text x="620" y="145" font-family="Verdana, sans-serif" font-size="13" font-weight="normal" fill="#59452e">Use multiple pages for larger rewards.</text><path d="M515 178H915" stroke="#ceb893"/><text x="515" y="205" font-family="Verdana, sans-serif" font-size="13" font-weight="normal" fill="#7c6548">Native Envelope packages · Six slots per page</text><rect x="20" y="250" width="450" height="210" rx="12" fill="url(#paper)"/><g transform="translate(45 287)"><g fill="none" stroke="#9270ca" stroke-width="4"><path d="M25 8H59L82 31V65L59 88H25L2 65V31Z"/><path d="M29 18H55L72 35V61L55 78H29L12 61V35Z M42 19L69 67H15Z M42 78L15 30H69Z"/></g><g fill="#ceaff3"><path d="M40 38H45V57H40Z M33 45H52V50H33Z"/><path d="M78 0H82V6H88V10H82V16H78V10H72V6H78Z"/></g></g><text x="150" y="314" font-family="Verdana, sans-serif" font-size="24" font-weight="bold" fill="#59452e">Magic circles</text><text x="150" y="350" font-family="Verdana, sans-serif" font-size="13" font-weight="normal" fill="#59452e">Hold to activate a quest or command.</text><text x="150" y="375" font-family="Verdana, sans-serif" font-size="13" font-weight="normal" fill="#59452e">Finish with a magical glow and particles.</text><path d="M45 408H445" stroke="#ceb893"/><text x="45" y="435" font-family="Verdana, sans-serif" font-size="13" font-weight="normal" fill="#7c6548">Position · Size · Ink color · Magic color</text><rect x="490" y="250" width="450" height="210" rx="12" fill="url(#paper)"/><g transform="translate(515 287)"><path fill="#f9eedb" stroke="#956e42" stroke-width="3" d="M0 34H88V82H0Z"/><path fill="none" stroke="#885c99" stroke-width="3" d="M12 65Q36 31 30 52T21 66Q42 55 45 59T43 68Q55 43 57 60T77 60 M10 74L77 71"/><path fill="#f4e4bd" stroke="#8c6638" stroke-width="3" d="M52 39L62 14L78 2L88 6L85 24L67 41Z"/><path fill="none" stroke="#8c6638" stroke-width="3" d="M49 53L79 13"/></g><text x="620" y="314" font-family="Verdana, sans-serif" font-size="24" font-weight="bold" fill="#59452e">Player signatures</text><text x="620" y="350" font-family="Verdana, sans-serif" font-size="13" font-weight="normal" fill="#59452e">Sign with a name or @s. Add a frame,</text><text x="620" y="375" font-family="Verdana, sans-serif" font-size="13" font-weight="normal" fill="#59452e">a command and a lasting enchanted shine.</text><path d="M515 408H915" stroke="#ceb893"/><text x="515" y="435" font-family="Verdana, sans-serif" font-size="13" font-weight="normal" fill="#7c6548">Feather animation · Writing sound · Sign once</text></svg>